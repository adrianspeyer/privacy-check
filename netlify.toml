[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Revalidate the worker so an accepted update switches the whole local shell.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# The endpoint also sets these headers on its own function responses.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Netlify-CDN-Cache-Control = "no-store"
